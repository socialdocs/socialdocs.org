<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <!-- Solid purple background for better PNG conversion -->
  <circle cx="250" cy="250" r="225" fill="#6364FF"/>

  <!-- Network nodes representing federation -->
  <!-- Central node -->
  <circle cx="250" cy="250" r="40" fill="white"/>

  <!-- Outer nodes -->
  <circle cx="250" cy="110" r="30" fill="white" opacity="0.9"/>
  <circle cx="370" cy="180" r="30" fill="white" opacity="0.9"/>
  <circle cx="370" cy="320" r="30" fill="white" opacity="0.9"/>
  <circle cx="250" cy="390" r="30" fill="white" opacity="0.9"/>
  <circle cx="130" cy="320" r="30" fill="white" opacity="0.9"/>
  <circle cx="130" cy="180" r="30" fill="white" opacity="0.9"/>

  <!-- Connection lines -->
  <line x1="250" y1="210" x2="250" y2="140" stroke="white" stroke-width="10" opacity="0.7"/>
  <line x1="280" y1="225" x2="340" y2="190" stroke="white" stroke-width="10" opacity="0.7"/>
  <line x1="280" y1="275" x2="340" y2="310" stroke="white" stroke-width="10" opacity="0.7"/>
  <line x1="250" y1="290" x2="250" y2="360" stroke="white" stroke-width="10" opacity="0.7"/>
  <line x1="220" y1="275" x2="160" y2="310" stroke="white" stroke-width="10" opacity="0.7"/>
  <line x1="220" y1="225" x2="160" y2="190" stroke="white" stroke-width="10" opacity="0.7"/>
</svg>
